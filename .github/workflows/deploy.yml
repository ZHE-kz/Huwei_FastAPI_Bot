name: Deploy bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: taicu-502512
  GCP_REGION: asia-east1
  CLOUD_RUN_SERVICE: huwei-fastapi-bot
  CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: huwei-bot-runtime@taicu-502512.iam.gserviceaccount.com
  CLOUD_RUN_BUILD_SERVICE_ACCOUNT: huwei-bot-builder@taicu-502512.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Cloud Run
        shell: bash
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --source . \
            --allow-unauthenticated \
            --service-account "$CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT" \
            --build-service-account "$CLOUD_RUN_BUILD_SERVICE_ACCOUNT" \
            --no-cpu-throttling \
            --timeout 300 \
            --set-secrets "LINE_ACCESS_TOKEN=LINE_ACCESS_TOKEN:latest,LINE_CHANNEL_SECRET=LINE_CHANNEL_SECRET:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,CWA_API_KEY=CWA_API_KEY:latest,GOOGLE_DRIVE_FOLDER_ID=GOOGLE_DRIVE_FOLDER_ID:latest" \
            --quiet

name: Deploy bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0850797474
  GCP_REGION: asia-east1
  CLOUD_RUN_SERVICE: huwei-fastapi-bot
  CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: huwei-bot-runtime@gen-lang-client-0850797474.iam.gserviceaccount.com
  CLOUD_RUN_BUILD_SERVICE_ACCOUNT: projects/gen-lang-client-0850797474/serviceAccounts/huwei-bot-builder@gen-lang-client-0850797474.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Cloud Run
        shell: bash
        run: |
          COMMIT_TITLE_B64="$(git log -1 --pretty=%s | base64 -w 0)"
          COMMIT_SUMMARY="$(jq -r '(.commits // [])[0:20][] | "- " + (.message | split("\n")[0] | .[0:160])' "$GITHUB_EVENT_PATH")"
          if [ -z "$COMMIT_SUMMARY" ]; then COMMIT_SUMMARY="- $(git log -1 --pretty=%s)"; fi
          COMMIT_SUMMARY_B64="$(printf '%s' "$COMMIT_SUMMARY" | base64 -w 0)"
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --source . \
            --allow-unauthenticated \
            --service-account "$CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT" \
            --build-service-account "$CLOUD_RUN_BUILD_SERVICE_ACCOUNT" \
            --no-cpu-throttling \
            --timeout 300 \
            --set-env-vars "DEPLOY_COMMIT_SHA=$GITHUB_SHA,DEPLOY_COMMIT_TITLE_B64=$COMMIT_TITLE_B64,DEPLOY_COMMIT_SUMMARY_B64=$COMMIT_SUMMARY_B64,PUZZLE_ADMIN_BASE_URL=https://linebot.zheforge.com,PUZZLE_ADMIN_EMAILS=kuizhelin@gmail.com,GOOGLE_CLIENT_ID=142820875824-rcmc64om2pm5k6jcp3u53668b8abef42.apps.googleusercontent.com,GITHUB_CLIENT_ID=Ov23limEsChj1UUD4Uxf" \
            --set-secrets "LINE_ACCESS_TOKEN=LINE_ACCESS_TOKEN:latest,LINE_CHANNEL_SECRET=LINE_CHANNEL_SECRET:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,CWA_API_KEY=CWA_API_KEY:latest,GOOGLE_DRIVE_FOLDER_ID=GOOGLE_DRIVE_FOLDER_ID:latest,PUZZLE_ADMIN_SECRET=PUZZLE_ADMIN_SECRET:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,GITHUB_CLIENT_SECRET=GITHUB_CLIENT_SECRET:latest" \
            --quiet
